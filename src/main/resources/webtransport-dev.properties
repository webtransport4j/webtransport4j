# WebTransport4J Development Profile Configuration
# Loaded when webtransport4j.profile=dev or in local development environments

# Profile Identifier
webtransport4j.profile=dev

# Enables development mode; configured certificate paths or an explicit QuicSslContext are required
webtransport4j.dev_mode=true

# Development profile allows wildcard origins for ease of testing
webtransport4j.allowed.origins=*
