# WebTransport4J Test Profile Configuration
# Loaded when webtransport4j.profile=test or during automated test runs

# Profile Identifier
webtransport4j.profile=test

# Test TLS certificate and private key paths for tests running without explicit cert configuration
webtransport4j.ssl.key.path=src/test/resources/test-key.pem
webtransport4j.ssl.cert.path=src/test/resources/test-cert.pem

# Automated test runs permit wildcard origins by default
webtransport4j.allowed.origins=*
