name: Release & Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      auto_publish:
        description: 'Auto-publish on Sonatype Central Portal (true = immediate publish, false = review in portal first)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    name: Build, Sign & Publish to Maven Central
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up JDK 25 with Maven Central & GPG configuration
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: '25'
          distribution: temurin
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-publish-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-publish-
            ${{ runner.os }}-maven-

      - name: Build canonical release artifact
        run: mvn --batch-mode --errors --no-transfer-progress clean package -DskipTests

      - name: Validate multi-release JAR integrity
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find target -maxdepth 1 -type f \
            -name 'webtransport4j-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-examples.jar' \
            -print)
          [[ "${#artifacts[@]}" -eq 1 ]]
          artifact="${artifacts[0]}"
          test -s "$artifact"

          jar --validate --file "$artifact"
          python3 scripts/verify-release-artifact.py "$artifact" pom.xml

      - name: Publish to Sonatype Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          AUTO_PUBLISH: ${{ inputs.auto_publish || 'true' }}
        run: |
          mvn --batch-mode --errors --no-transfer-progress clean deploy \
            -P release \
            -DskipTests \
            -DautoPublish=${AUTO_PUBLISH}

      - name: Generate SHA-256 Checksums
        run: |
          sha256sum pom.xml > target/pom.xml.sha256
          cd target
          for f in webtransport4j-*.jar; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          fi

          echo "Target release tag: $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            files=()
            for f in target/webtransport4j-*.jar target/webtransport4j-*.jar.sha256 pom.xml target/pom.xml.sha256; do
              if [ -f "$f" ]; then
                files+=("$f")
              fi
            done
            gh release upload "$tag" "${files[@]}" --clobber
            echo "Uploaded release artifacts to GitHub release $tag"
          else
            echo "GitHub release $tag does not exist yet; skipping asset upload."
          fi
