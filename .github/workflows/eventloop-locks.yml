name: Event-loop lock safety
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locking:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Run shared event-loop safety gate
        run: bash verification/locking/check.sh
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eventloop-locks-java-${{ matrix.java }}
          path: |
            ${{ runner.temp }}/worktree.*/target-maven/surefire-reports/**
            ${{ runner.temp }}/lock-count
            ${{ runner.temp }}/negative-count
            ${{ runner.temp }}/static-negative.log
