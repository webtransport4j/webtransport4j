# ==============================================================================
# WebTransport4J - Pre-Commit Configuration
# See https://pre-commit.com for more information
# ==============================================================================
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

repos:
  # 1. Standard repository hygiene and security hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-json
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: '^config/release-smoke/'
      - id: end-of-file-fixer
        exclude: '\.(pem|key|crt|der|log)$'
      - id: trailing-whitespace
        exclude: '\.(pem|key|crt|der|log)$'
      - id: detect-private-key
        exclude: '^\.githooks/'

  # 2. WebTransport4J repository-specific integrity gates
  - repo: local
    hooks:
      # Enforce zero-committed-certificate policy
      - id: no-committed-certificates
        name: Block committed certificate and key files
        entry: "bash -c 'for f in \"$@\"; do echo \"❌ [FAIL] Prohibited certificate or private key file: $f\" >&2; exit 1; done' --"
        language: system
        types_or: [file]
        files: '\.(pem|key|pkcs8|p12|pfx|crt|der)$'

      # Google Java Style enforcement via Maven Checkstyle
      - id: maven-checkstyle
        name: Maven Checkstyle (Google Java Style)
        entry: mvn --batch-mode checkstyle:check
        language: system
        pass_filenames: false
        files: '(\.java$|pom\.xml$|config/checkstyle/.*\.xml$)'

      # Multi-Release Compilation Gate (javac 8, 11, 25)
      - id: maven-compile
        name: Multi-Release Compilation Gate
        entry: mvn --batch-mode test-compile -DskipTests
        language: system
        pass_filenames: false
        files: '(\.java$|pom\.xml$)'
