version: '3.8'

services:
  # 1. WebTransport4J Enterprise Observability Dashboard (Production UI)
  webtransport-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webtransport-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - telemetry-net

  # 2. OpenTelemetry Collector (Receives OTLP metrics & traces from WebTransport4J)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    networks:
      - telemetry-net

  # 3. Prometheus (Time-series metrics engine)
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    networks:
      - telemetry-net

networks:
  telemetry-net:
    driver: bridge
